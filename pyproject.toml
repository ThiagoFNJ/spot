[project]
name = "spot"
version = "0.1.0"
description = "Monitoramento dos vereadores da Câmara Municipal de Salvador: presença, produtividade e custo"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.0",
    "pdfplumber>=0.11",
    "duckdb>=1.1",
    "pydantic>=2.0",
    "typer>=0.12",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
gcp = ["google-cloud-storage>=2.18", "google-cloud-bigquery>=3.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spot"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["docs/spike/evidence"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "E741", "E731"]

[dependency-groups]
dev = [
    "playwright>=1.64.1",
]
